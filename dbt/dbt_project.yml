name: fundos_dw
version: "0.1.0"
config-version: 2
profile: fundos_dw

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

# RNF-05: staging -> intermediate -> marts layers; naming convention in docs/naming-conventions.md
models:
  fundos_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# RF-03 (3.2): reference data (national holidays), in its own schema.
seeds:
  fundos_dw:
    +schema: seeds
    # RF-05 (4.3): synthetic fixture of the network-free negative suite
    # (scripts/negative_fixture_tests.py). Disabled unless --vars '{negative_fixture: true}', so
    # normal `dbt seed` / `dbt build` runs never load it.
    negative:
      +schema: negative_fixture
      +enabled: "{{ var('negative_fixture', false) }}"
