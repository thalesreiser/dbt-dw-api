version: 2

# RF-03 (3.2): intermediate models (ephemeral unless noted). Design: docs/dimensional-model.md.

models:
  - name: int_fundo_classe__unificado
    description: >
      Fund and class registries unified at the grain of the daily report key. Grain: one row per
      reporting CNPJ (`cnpj_fundo_classe`). `CLASSE` rows: one per class CNPJ, with the class
      attributes and those of its parent fund. `FUNDO` rows: one per fund CNPJ that is neither a
      class CNPJ nor the CNPJ of a fund with classes (funds not adapted to Resolution 175); class
      columns are null. When a CNPJ has several registry ids, the non-cancelled one is kept,
      then the latest `dt_registro`, then the highest registry id. Registry status is kept
      as-is (a `CANCELADO` fund that still reports keeps that status). Materialized as a view in
      schema `intermediate` (RF-04, 3.4) because it is the input of the SCD2 snapshot
      `snp_cvm__fundo_classe`, which `dim_fundo` reads.
    tests:
      - dbt_utils.expression_is_true:
          expression: "(tp_registro = 'CLASSE') = (id_registro_classe is not null)"
    columns:
      - name: cnpj_fundo_classe
        description: Reporting CNPJ (class CNPJ, else fund CNPJ); natural key.
        tests: [not_null, unique, valid_cnpj]
      - name: tp_registro
        description: "`CLASSE` or `FUNDO`: which registry the row comes from."
        tests:
          - not_null
          - accepted_values:
              values: ["CLASSE", "FUNDO"]
      - name: id_registro_classe
        description: CVM registry id of the class; null for fund-only rows.
        tests:
          - relationships:
              to: ref('stg_cvm__cadastro_classes')
              field: id_registro_classe
      - name: id_registro_fundo
        description: CVM registry id of the fund (the parent fund for class rows).
        tests:
          - not_null
          - relationships:
              to: ref('stg_cvm__cadastro_fundos')
              field: id_registro_fundo
      - name: cnpj_fundo
        description: CNPJ of the fund (the parent fund for class rows).
        tests: [not_null, valid_cnpj]
      - name: nm_denominacao_social
        description: Legal name of the class, else of the fund.
        tests: [not_null]
      - name: nm_denominacao_social_fundo
        description: Legal name of the fund.
      - name: tp_fundo
        description: Fund type (e.g. FI, FIF, FIDC).
      - name: tp_classe
        description: Class type; null for fund-only rows.
      - name: sit_fundo_classe
        description: Registry status of the class, else of the fund.
        tests: [not_null]
      - name: sit_fundo
        description: Registry status of the fund.
      - name: tp_classificacao
        description: CVM classification of the class; null for fund-only rows.
      - name: tp_classificacao_anbima
        description: ANBIMA classification of the class; null for fund-only rows.
      - name: tp_condominio
        description: Open or closed-end (`ABERTO`, `FECHADO`); null for fund-only rows.
      - name: tp_publico_alvo
        description: Target investors of the class; null for fund-only rows.
      - name: fl_exclusivo
        description: Exclusive class flag; null for fund-only rows.
      - name: cnpj_administrador
        description: CNPJ of the fund administrator.
      - name: nm_administrador
        description: Name of the fund administrator.
      - name: cpf_cnpj_gestor
        description: CPF or CNPJ of the fund manager (first manager, ADR 006).
      - name: nm_gestor
        description: Name of the fund manager (first manager, ADR 006).
      - name: dt_registro
        description: Registration date at CVM of the kept registry entry (class, else fund).
