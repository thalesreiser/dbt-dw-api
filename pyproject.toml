[project]
name = "fundos-api"
version = "0.1.0"
description = "Data warehouse with dbt, data quality and a REST API on investment fund data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "duckdb>=1.1,<2",  # 2.0 (2026-10-21) is a new major; adopt it deliberately (dbt-duckdb support first)
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.11,<1.12", "dbt-duckdb>=1.11,<1.12"]  # pinned together (same minor)
loadtest = ["locust==2.46.7"]  # RNF-01 load test only (.github/workflows/loadtest.yml)
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "schemathesis>=4.0", "ruff>=0.6", "black>=24", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (task 5.6) build a test warehouse with dbt: run them with `make test-integration`.
# Contract tests (task 6.1, Schemathesis) use the same test warehouse: `make test-contract`.
addopts = "--cov=fundos_api --cov-report=term-missing -m \"not integration and not contract\""
markers = [
    "integration: API over a test warehouse built by the real dbt project (needs dbt)",
    "contract: Schemathesis against the OpenAPI over the dbt-built test warehouse (needs dbt)",
]
