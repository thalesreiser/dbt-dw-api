name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,dbt]"
      - run: make lint
      - run: make test
      - run: make deps && dbt parse --project-dir dbt --profiles-dir dbt
      # Task 7.1: dbt build on a sample + Schemathesis against the OpenAPI spec
