name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,dbt]"
      - run: make lint
      - run: make test
      - run: make deps && dbt parse --project-dir dbt --profiles-dir dbt
      # Task 7.1: dbt build on a sample + Schemathesis against the OpenAPI spec

  # RF-05 acceptance (4.3): network-free negative suite. Synthetic seeds (dbt/seeds/negative/)
  # replace the CVM data; the clean case passes every test and each invalid case (null and
  # duplicate keys, orphan keys, RN-01, RN-02, SCD2 overlap) fails exactly its expected tests.
  negative-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dbt]"
      - name: Negative suite on synthetic seeds
        run: make negative-fixture

  # RF-01 acceptance: load one real reference month from the CVM open data (R-P3-01),
  # then prove the sources exist with `dbt source freshness` and a row count per source.
  # RF-02: the same job builds the staging models and runs their tests against that month.
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_PATH: data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dbt]"
      # Two months (RF-03, 3.3): monthly net inflows per month and an incremental fact over more
      # than one reference month.
      - name: Load the two previous reference months from CVM
        run: make load COMPETENCIAS=2
      - name: dbt source freshness
        run: make deps freshness
      - name: Row count per source
        run: make row-counts
      - name: Source tests
        run: dbt test --select "source:*" --project-dir dbt --profiles-dir dbt
      # RF-02 acceptance: every source has a stg_ model; build them and run their tests on the
      # real month (fails on any test error; warnings are reported but do not fail).
      - name: Staging models and tests
        run: make staging
      # RF-04 (3.4): SCD2 snapshot of the registry before the marts. History lives only for this
      # run (the DuckDB file is discarded), so every CNPJ has one version here.
      - name: Registry snapshot
        run: make snapshot
      # RF-03 acceptance (3.2): build the holidays seed, the intermediate model and the
      # dimensions on the same real months, and run their tests (unique, non-null keys).
      # RF-03 acceptance (3.3): the facts too, with `relationships` tests (no orphans).
      - name: Marts models and tests
        run: make marts
      # RF-06 (4.2): dbt docs (descriptions and lineage, sources to the `fundos_api` exposure)
      # on the built warehouse, so the catalog has every column; fails on undocumented items.
      - name: dbt docs and documentation coverage
        run: make docs docs-coverage
      - name: Upload dbt docs
        uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          if-no-files-found: error
          retention-days: 14
      # ADR 003: a second incremental run with no new load must not change the daily fact.
      - name: Incremental fact is idempotent
        run: |
          count() { python -c "import duckdb; print(duckdb.connect('$DUCKDB_PATH', read_only=True).execute('select count(*) from marts.fct_informe_diario').fetchone()[0])"; }
          before=$(count)
          dbt build --select fct_informe_diario --project-dir dbt --profiles-dir dbt
          after=$(count)
          echo "fct_informe_diario rows: $before -> $after"
          test "$before" = "$after"
      # RF-05 acceptance (4.1): inject rows breaking RN-01 and RN-02 into a copy of the
      # warehouse and assert that the rule tests fail on them (and pass before).
      - name: Negative tests (RN-01, RN-02)
        run: make negative-tests
      # RF-04 acceptance (3.4): change one registry attribute on a copy of the warehouse,
      # snapshot again and assert two versions with contiguous validity.
      - name: SCD2 simulation
        run: make scd2-sim
