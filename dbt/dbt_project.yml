name: fundos_dw
version: "0.1.0"
config-version: 2
profile: fundos_dw

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

# Behaviour flags (dbt 1.11 upgrade, 2026-10-22). Set explicitly to the dbt 1.11 defaults for the
# flags whose default changed since dbt 1.8, so a future default flip cannot change the project
# silently. None of them changes the outputs here: no package overrides a built-in
# materialization, no resource name has spaces, the project has no on-run hooks, and every generic
# test passes its arguments under `arguments:`.
flags:
  require_explicit_package_overrides_for_builtin_materializations: true
  require_resource_names_without_spaces: true
  source_freshness_run_project_hooks: true
  require_generic_test_arguments_property: true

# RNF-05: staging -> intermediate -> marts layers; naming convention in docs/naming-conventions.md
models:
  fundos_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# RF-03 (3.2): reference data (national holidays), in its own schema.
seeds:
  fundos_dw:
    +schema: seeds
    # RF-05 (4.3): synthetic fixture of the network-free negative suite
    # (scripts/negative_fixture_tests.py). Disabled unless --vars '{negative_fixture: true}', so
    # normal `dbt seed` / `dbt build` runs never load it.
    negative:
      +schema: negative_fixture
      +enabled: "{{ var('negative_fixture', false) }}"
