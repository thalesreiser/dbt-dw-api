# Dependabot version updates. Security alerts are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    assignees: ["thalesreiser"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # DuckDB 2 is a new major: adopt it in a dedicated PR once dbt-duckdb supports it.
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees: ["thalesreiser"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
