[project]
name = "fundos-api"
version = "0.1.0"
description = "Data warehouse with dbt, data quality and a REST API on investment fund data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8.1,<1.9", "dbt-duckdb>=1.8,<1.9"]
loadtest = ["locust==2.37.14"]  # RNF-01 load test only (.github/workflows/loadtest.yml)
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "schemathesis>=3.36", "ruff>=0.6", "black>=24", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fundos_api --cov-report=term-missing"
